```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - My Restaurant</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html"
        >
            🍽️ My Restaurant - Admin
        </a>


        <button
            id="logoutBtn"
            class="btn btn-outline-light"
        >
            Logout
        </button>

    </div>

</nav>



<!-- ================= ADMIN CONTAINER ================= -->

<div class="container mt-5 mb-5">


    <!-- PAGE TITLE -->

    <div class="mb-4">

        <h1>
            Admin Dashboard
        </h1>

        <p class="text-muted">
            Manage menu items and customer orders
        </p>

    </div>



    <!-- ================= MENU MANAGEMENT ================= -->

    <div class="card shadow-sm mb-5">

        <div class="card-header">

            <h4 class="mb-0">
                Add Menu Item
            </h4>

        </div>


        <div class="card-body">

            <form id="menuForm">

                <div class="row g-3">


                    <!-- NAME -->

                    <div class="col-md-6">

                        <label
                            for="menuName"
                            class="form-label"
                        >
                            Food Name
                        </label>

                        <input
                            type="text"
                            id="menuName"
                            class="form-control"
                            placeholder="Example: Chicken Burger"
                            required
                        >

                    </div>



                    <!-- CATEGORY -->

                    <div class="col-md-6">

                        <label
                            for="menuCategory"
                            class="form-label"
                        >
                            Category
                        </label>

                        <select
                            id="menuCategory"
                            class="form-select"
                            required
                        >

                            <option value="">
                                Select Category
                            </option>

                            <option value="Pizza">
                                Pizza
                            </option>

                            <option value="Burger">
                                Burger
                            </option>

                            <option value="Drinks">
                                Drinks
                            </option>

                        </select>

                    </div>



                    <!-- DESCRIPTION -->

                    <div class="col-md-12">

                        <label
                            for="menuDescription"
                            class="form-label"
                        >
                            Description
                        </label>

                        <textarea
                            id="menuDescription"
                            class="form-control"
                            rows="3"
                            placeholder="Enter food description"
                            required
                        ></textarea>

                    </div>



                    <!-- PRICE -->

                    <div class="col-md-4">

                        <label
                            for="menuPrice"
                            class="form-label"
                        >
                            Price
                        </label>

                        <input
                            type="number"
                            id="menuPrice"
                            class="form-control"
                            step="0.01"
                            min="0"
                            placeholder="8.99"
                            required
                        >

                    </div>



                    <!-- IMAGE URL -->

                    <div class="col-md-8">

                        <label
                            for="menuImage"
                            class="form-label"
                        >
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="menuImage"
                            class="form-control"
                            placeholder="https://example.com/image.jpg"
                        >

                    </div>



                    <!-- AVAILABLE -->

                    <div class="col-md-4">

                        <div class="form-check mt-4">

                            <input
                                type="checkbox"
                                id="menuAvailable"
                                class="form-check-input"
                                checked
                            >

                            <label
                                for="menuAvailable"
                                class="form-check-label"
                            >
                                Available
                            </label>

                        </div>

                    </div>



                    <!-- BUTTON -->

                    <div class="col-md-8 text-end">

                        <button
                            type="submit"
                            class="btn btn-dark"
                        >
                            Add Menu Item
                        </button>

                    </div>

                </div>

            </form>


            <!-- MESSAGE -->

            <div
                id="menuMessage"
                class="mt-3"
            ></div>

        </div>

    </div>



    <!-- ================= MENU LIST ================= -->

    <div class="card shadow-sm mb-5">

        <div class="card-header">

            <h4 class="mb-0">
                Manage Menu
            </h4>

        </div>


        <div class="card-body">

            <div
                id="adminMenuList"
                class="row g-4"
            >

                <!-- Menu items will be loaded by JavaScript -->

            </div>

        </div>

    </div>



    <!-- ================= ORDERS ================= -->

    <div class="card shadow-sm">

        <div class="card-header">

            <h4 class="mb-0">
                Customer Orders
            </h4>

        </div>


        <div class="card-body">

            <div class="table-responsive">

                <table class="table table-bordered">

                    <thead>

                        <tr>

                            <th>
                                Order ID
                            </th>

                            <th>
                                User ID
                            </th>

                            <th>
                                Items
                            </th>

                            <th>
                                Total
                            </th>

                            <th>
                                Status
                            </th>

                            <th>
                                Date
                            </th>

                            <th>
                                Action
                            </th>

                        </tr>

                    </thead>


                    <tbody id="ordersTableBody">

                        <!-- Orders will be loaded by JavaScript -->

                    </tbody>

                </table>

            </div>

        </div>

    </div>


</div>



<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<!-- ================= SUPABASE ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- Supabase Configuration -->

<script src="js/supabase.js"></script>


<!-- Admin JavaScript -->

<script src="js/admin.js"></script>


</body>

</html>
```
