<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand fw-bold">☕ Admin Dashboard</span>
      <div>
        <a href="index.html" class="btn btn-outline-light btn-sm me-2">Customer View</a>
        <button onclick="logoutUser()" class="btn btn-danger btn-sm">Logout</button>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <!-- STATS -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3"><div class="card bg-primary text-white p-3"><h6>Total Orders</h6><h3 id="statOrders">0</h3></div></div>
      <div class="col-6 col-md-3"><div class="card bg-success text-white p-3"><h6>Revenue</h6><h3 id="statRev">PKR 0.00</h3></div></div>
      <div class="col-6 col-md-3"><div class="card bg-warning text-dark p-3"><h6>Pending</h6><h3 id="statPending">0</h3></div></div>
      <div class="col-6 col-md-3"><div class="card bg-info text-white p-3"><h6>Menu Items</h6><h3 id="statMenu">0</h3></div></div>
    </div>

    <!-- ORDERS -->
    <h4 class="fw-bold mb-3">Live Orders</h4>
    <div class="table-responsive bg-white shadow-sm p-3 rounded mb-4">
      <table class="table align-middle">
        <thead><tr><th>Order ID</th><th>Items</th><th>Total</th><th>Status</th></tr></thead>
        <tbody id="adminOrdersTable"></tbody>
      </table>
    </div>

    <!-- MENU CRUD -->
    <h4 class="fw-bold mb-3">Menu Management</h4>
    <div class="row g-3">
      <div class="col-md-4">
        <form id="menuForm" onsubmit="addMenu(event)" class="card p-3 shadow-sm">
          <h6 class="fw-bold mb-2">Add Menu Item</h6>
          <input type="text" id="mName" class="form-control mb-2" placeholder="Item Name" required>
          <input type="number" step="0.01" id="mPrice" class="form-control mb-2" placeholder="Price (PKR)" required>
          <select id="mCat" class="form-select mb-2" required>
            <option value="Coffee">Coffee</option>
            <option value="Bakery">Bakery</option>
            <option value="Cakes">Cakes</option>
            <option value="Fast Food">Fast Food</option>
          </select>
          <input type="url" id="mImg" class="form-control mb-3" placeholder="Image URL" required>
          <button class="btn btn-cafe w-100">Add Item</button>
        </form>
      </div>
      <div class="col-md-8">
        <div class="table-responsive bg-white shadow-sm p-3 rounded">
          <table class="table">
            <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Action</th></tr></thead>
            <tbody id="adminMenuTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
