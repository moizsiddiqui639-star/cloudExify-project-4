<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafe & Bakery — Delicious Fresh Ordering</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVIGATION -->
  <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">☕ Cafe & Bakery</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="index.html">Home & Menu</a></li>
          <li class="nav-item"><a class="nav-link" href="#myOrdersSection">My Orders</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-center" id="navAuthLinks">
          <!-- Dynamically filled by auth.js -->
        </ul>
        <button class="btn btn-warning position-relative ms-3" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
          🛒 Cart
          <span id="cartBadge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
        </button>
      </div>
    </div>
  </nav>

  <!-- HERO SECTION -->
  <header class="hero-section text-center mb-5">
    <div class="container">
      <h1 class="display-4 fw-bold mb-3">Cafe & Bakery</h1>
      <p class="lead">Fresh Coffee • Delicious Bakery • Easy Ordering</p>
      <a href="#menuSection" class="btn btn-cafe btn-lg mt-3">View Menu</a>
    </div>
  </header>

  <main class="container mb-5">
    <!-- MENU SECTION -->
    <section id="menuSection" class="mb-5">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4">
        <h2 class="fw-bold">Our Menu</h2>
        <div class="mt-3 mt-md-0">
          <input type="text" id="searchInput" class="form-control" placeholder="Search menu..." oninput="searchMenu(this.value)">
        </div>
      </div>

      <!-- CATEGORY FILTERS -->
      <div class="mb-4 d-flex flex-wrap gap-2">
        <button class="btn btn-dark btn-category active" data-category="All" onclick="filterCategory('All', this)">All</button>
        <button class="btn btn-outline-dark btn-category" data-category="Coffee" onclick="filterCategory('Coffee', this)">Coffee</button>
        <button class="btn btn-outline-dark btn-category" data-category="Bakery" onclick="filterCategory('Bakery', this)">Bakery</button>
        <button class="btn btn-outline-dark btn-category" data-category="Cakes" onclick="filterCategory('Cakes', this)">Cakes</button>
        <button class="btn btn-outline-dark btn-category" data-category="Fast Food" onclick="filterCategory('Fast Food', this)">Fast Food</button>
      </div>

      <!-- CARDS GRID -->
      <div class="row" id="menuGrid">
        <!-- JS dynamic content -->
      </div>
    </section>

    <hr class="my-5">

    <!-- MY ORDERS SECTION -->
    <section id="myOrdersSection" class="mb-5">
      <h3 class="fw-bold mb-4">My Orders</h3>
      <div id="customerOrdersList">
        <!-- JS dynamic customer orders -->
      </div>
    </section>
  </main>

  <!-- CART OFFCANVAS -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title">Your Cart</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column">
      <div id="cartItems" class="flex-grow-1"></div>
      <div class="border-top pt-3 mt-auto">
        <div class="d-flex justify-content-between font-weight-bold mb-3">
          <span>Total:</span>
          <span id="cartTotal" class="fw-bold">AED 0.00</span>
        </div>
        <button id="checkoutBtn" class="btn btn-cafe w-100" onclick="checkoutOrder()">Checkout</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="cartToast" class="toast align-items-center text-bg-dark border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">Item added to cart!</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <p class="mb-0 small">&copy; 2026 Cafe & Bakery ordering app. Built for CloudExify Internship.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/menu.js"></script>
  <script src="js/orders.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', checkAuthUI);
  </script>
</body>
</html>
