<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Restaurant</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">
            🍽️ My Restaurant
        </a>


        <div>

            <a
                href="login.html"
                class="btn btn-outline-light me-2"
            >
                Login
            </a>


            <a
                href="register.html"
                class="btn btn-warning"
            >
                Register
            </a>

        </div>

    </div>

</nav>



<!-- ================= HERO ================= -->

<section class="hero text-center">

    <div class="container">

        <h1>Delicious Food</h1>

        <p>
            Fresh and delicious food for everyone
        </p>

    </div>

</section>



<!-- ================= MENU ================= -->

<section class="container mt-5">

    <h2 class="text-center mb-4">
        Our Menu
    </h2>


    <!-- SEARCH -->

    <input
        type="text"
        id="searchInput"
        class="form-control mb-4"
        placeholder="Search food..."
    >



    <!-- CATEGORY BUTTONS -->

    <div class="text-center mb-4">

        <button
            class="btn btn-outline-dark category-btn"
            data-category="all"
        >
            All
        </button>


        <button
            class="btn btn-outline-dark category-btn"
            data-category="Pizza"
        >
            Pizza
        </button>


        <button
            class="btn btn-outline-dark category-btn"
            data-category="Burger"
        >
            Burger
        </button>


        <button
            class="btn btn-outline-dark category-btn"
            data-category="Drinks"
        >
            Drinks
        </button>

    </div>



    <!-- MENU ITEMS WILL COME HERE -->

    <div
        id="menuGrid"
        class="row"
    >

        <!-- JavaScript will add food cards here -->

    </div>

</section>



<!-- ================= CART ================= -->

<div
    class="offcanvas offcanvas-end"
    tabindex="-1"
    id="cartCanvas"
>

    <div class="offcanvas-header">

        <h5 class="offcanvas-title">
            🛒 Your Cart
        </h5>


        <button
            type="button"
            class="btn-close"
            data-bs-dismiss="offcanvas"
        ></button>

    </div>


    <div class="offcanvas-body">

        <div id="cartItems">

            <!-- Cart items will come here -->

        </div>


        <hr>


        <h4>
            Total:
            $<span id="cartTotal">0.00</span>
        </h4>


        <button
            class="btn btn-success w-100 mt-3"
            onclick="placeOrder()"
        >
            Place Order
        </button>

    </div>

</div>



<!-- ================= MY ORDERS ================= -->

<section class="container mt-5 mb-5">

    <h2 class="mb-4">
        My Orders
    </h2>


    <div id="ordersList">

        <!-- Orders will come here -->

    </div>

</section>



<!-- ================= BOOTSTRAP JS ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
