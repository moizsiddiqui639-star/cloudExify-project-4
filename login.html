<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login — Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
  <div class="card p-4 shadow-sm" style="width: 350px;">
    <h3 class="text-center fw-bold mb-3">Login</h3>
    <form id="loginForm">
      <div class="mb-3"><input type="email" id="email" class="form-control" placeholder="Email" required></div>
      <div class="mb-3"><input type="password" id="pass" class="form-control" placeholder="Password" required></div>
      <button type="submit" class="btn btn-cafe w-100">Login</button>
    </form>
    <div class="text-center mt-3"><a href="register.html">Create account</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await loginUser(document.getElementById('email').value, document.getElementById('pass').value);
        const { data: p } = await supabase.from('profiles').select('role').eq('id', data.user.id).single();
        if (p && p.role === 'admin') window.location.href = 'admin.html';
        else window.location.href = 'index.html';
      } catch (err) { alert('Login failed. Please check your email and password.'); }
    });
  </script>
</body>
</html>
