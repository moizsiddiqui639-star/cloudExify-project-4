<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register — Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
  <div class="card p-4 shadow-sm" style="width: 350px;">
    <h3 class="text-center fw-bold mb-3">Register</h3>
    <form id="regForm">
      <div class="mb-2"><input type="text" id="name" class="form-control" placeholder="Full Name" required></div>
      <div class="mb-2"><input type="email" id="email" class="form-control" placeholder="Email" required></div>
      <div class="mb-2"><input type="password" id="pass" class="form-control" placeholder="Password" required minlength="6"></div>
      <div class="mb-3"><input type="password" id="cpass" class="form-control" placeholder="Confirm Password" required></div>
      <button type="submit" class="btn btn-cafe w-100">Register</button>
    </form>
    <div class="text-center mt-3"><a href="login.html">Back to Login</a></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (document.getElementById('pass').value !== document.getElementById('cpass').value) {
        alert('Passwords do not match.'); return;
      }
      try {
        await registerUser(document.getElementById('name').value, document.getElementById('email').value, document.getElementById('pass').value);
        alert('Registration successful!');
        window.location.href = 'login.html';
      } catch (err) { alert(err.message || 'Registration failed.'); }
    });
  </script>
</body>
</html>
