<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - My Restaurant</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a
            class="navbar-brand"
            href="index.html"
        >
            🍽️ My Restaurant
        </a>

        <a
            href="login.html"
            class="btn btn-outline-light"
        >
            Login
        </a>

    </div>

</nav>



<!-- ================= REGISTER SECTION ================= -->

<section class="container">

    <div class="row justify-content-center">

        <div class="col-md-6 col-lg-5">

            <div class="card shadow register-card">

                <div class="card-body p-4">


                    <h2 class="text-center mb-2">
                        Create Account
                    </h2>


                    <p class="text-center text-muted mb-4">
                        Register to order your favorite food
                    </p>



                    <!-- REGISTER FORM -->

                    <form id="registerForm">


                        <!-- FULL NAME -->

                        <div class="mb-3">

                            <label
                                for="fullName"
                                class="form-label"
                            >
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="fullName"
                                class="form-control"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>



                        <!-- EMAIL -->

                        <div class="mb-3">

                            <label
                                for="email"
                                class="form-label"
                            >
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >

                        </div>



                        <!-- PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                class="form-control"
                                placeholder="Enter password"
                                minlength="6"
                                required
                            >

                        </div>



                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="confirmPassword"
                                class="form-label"
                            >
                                Confirm Password
                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                placeholder="Confirm password"
                                minlength="6"
                                required
                            >

                        </div>



                        <!-- MESSAGE -->

                        <div
                            id="registerMessage"
                            class="mb-3"
                        ></div>



                        <!-- REGISTER BUTTON -->

                        <button
                            type="submit"
                            class="btn btn-dark w-100"
                        >
                            Create Account
                        </button>


                    </form>



                    <!-- LOGIN LINK -->

                    <p class="text-center mt-4 mb-0">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>


                </div>

            </div>

        </div>

    </div>

</section>



<!-- ================= SUPABASE ================= -->

<script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>


<!-- Supabase Configuration -->

<script src="js/supabase.js"></script>


<!-- Authentication -->

<script src="js/auth.js"></script>


</body>

</html>
